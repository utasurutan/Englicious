name: Englicious CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Type-Check & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check & Build
        run: npm run build

      - name: Upload Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: englicious-dist
          path: dist
          retention-days: 7
